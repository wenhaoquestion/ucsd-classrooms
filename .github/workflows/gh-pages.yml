name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Checkout classroom schedules
        uses: actions/checkout@v5
        with:
          ref: schedule-data
          path: .test-build/schedule-data
          sparse-checkout: |
            /classrooms-*.txt
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Stage public schedule files
        run: |
          mkdir -p static/schedules
          cp .test-build/schedule-data/classrooms-*.txt static/schedules/
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm ci
      - name: Validate
        run: |
          npm run typecheck
          npm run lint -- src scripts tests
          npm test
          npm run validate:indoor
      - name: Build
        run: npm run build
        env:
          # Geisel study room availability (see worker/README.md); optional
          LIBCAL_PROXY_URL: ${{ vars.LIBCAL_PROXY_URL || 'https://ucsd-classrooms-libcal.wenhaoquestion.workers.dev' }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout verification script
        uses: actions/checkout@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify published application, layout and schedules
        env:
          VERIFY_SCHEDULES: "1"
        run: node scripts/verify-deployment.mjs "${{ steps.deployment.outputs.page_url }}"
